
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>פתרון חובות וליווי פיננסי – בדיקת זכאות ותשלום חודשי משוער</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      direction: rtl;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    .form-card {
      background: #0f172a;
      color: white;
      padding: 24px;
      border-radius: 12px;
    }
    label {
      display: block;
      margin-top: 12px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: inherit;
    }
    button {
      margin-top: 16px;
      padding: 12px;
      width: 100%;
      background: #22c55e;
      border: none;
      border-radius: 999px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    #calc_result {
      margin-top: 16px;
      background: white;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>פתרון חובות ישראל – בדיקת זכאות ותשלום משוער</h1>

    <div class="form-card">
      <h2>בדיקת זכאות לשיפור מצב החובות</h2>
      <p>השאירו פרטים ונחזור אליכם לשיחה דיסקרטית וממוקדת, ללא התחייבות.</p>
      <form id="leadForm">
        <label for="name">שם מלא*</label>
        <input type="text" id="name" name="name" required>
        <label for="phone">טלפון נייד*</label>
        <input type="tel" id="phone" name="phone" required>
        <label for="email">אימייל (לא חובה)</label>
        <input type="email" id="email" name="email">
        <label for="reason">סיבת פנייה</label>
        <select id="reason" name="reason">
          <option value="">בחרו...</option>
          <option value="unite">איחוד הלוואות</option>
          <option value="spread">פריסת חוב</option>
          <option value="advice">ייעוץ פיננסי</option>
          <option value="other">אחר</option>
        </select>
        <label for="message">תיאור קצר (לא חובה)</label>
        <textarea id="message" name="message"></textarea>
        <button type="submit">רוצה לדבר עם מומחה ולבדוק אם יש לי פתרון</button>
        <p style="font-size: 0.85rem; color: #ccc; margin-top: 10px;">
          תודה! הפרטים התקבלו ונחזור אליך בהקדם האפשרי.
        </p>
      </form>
    </div>

    <hr style="margin:40px 0;">

    <div>
      <h2>מחשבון תשלום חודשי לפי טבלת הממונה</h2>
      <form id="calc-form" onsubmit="event.preventDefault(); calculateMonthlyPayment();">
        <label for="calc_adults">מבנה משפחתי</label>
        <select id="calc_adults" name="calc_adults">
          <option value="1">יחיד / נשוי חי בנפרד</option>
          <option value="2">זוג</option>
        </select>
        <label for="calc_children">מספר ילדים</label>
        <input type="number" id="calc_children" name="calc_children" min="0" value="0">
        <label for="calc_debtor_income">שכר נטו של החייב (₪)</label>
        <input type="number" id="calc_debtor_income">
        <label for="calc_spouse_income">שכר נטו בן/בת זוג (₪)</label>
        <input type="number" id="calc_spouse_income">
        <label for="calc_other_income">הכנסות אחרות (₪)</label>
        <input type="number" id="calc_other_income">
        <label for="calc_medical">הוצאות רפואיות חריגות (₪)</label>
        <input type="number" id="calc_medical">
        <label for="calc_travel">הוצאות נסיעה (₪)</label>
        <input type="number" id="calc_travel">
        <label for="calc_children_expenses">הוצאות טיפול בילדים (₪)</label>
        <input type="number" id="calc_children_expenses">
        <label for="calc_other_expenses">הוצאות נוספות (₪)</label>
        <input type="number" id="calc_other_expenses">
        <button type="submit">חשב תשלום חודשי משוער</button>
      </form>
      <div id="calc_result"></div>
    </div>
  </div>

  <script>
    document.getElementById('leadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const reason = document.getElementById('reason').value;
      const message = document.getElementById('message').value;
      fetch("https://script.google.com/macros/s/AKfycby4mu1HLs86lgbO5LBFR4ozg53iFlWDhj4SOp0IIeUQztOzhfgnVc6kaZmHBt9AbQ0M/exec", {
", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, reason, message })
      })
      .then(() => alert("✅ תודה! הפרטים נשלחו בהצלחה. נחזור אליך בהקדם."))
      .catch(() => alert("❌ אירעה שגיאה בשליחה. נסה שוב בעוד רגע."));
    });

    function getNum(id) {
      const val = parseFloat(document.getElementById(id).value.replace(/,/g, "")) || 0;
      return val;
    }
    function calcBaseLiving(adults, children) {
      let base = adults === 1 ? 4556 : 6024;
      const first = Math.min(children, 4);
      const rest = Math.max(0, children - 4);
      base += first * 1500 + rest * 1300;
      return base;
    }
    function calculateMonthlyPayment() {
      const adults = parseInt(document.getElementById("calc_adults").value) || 1;
      const children = parseInt(document.getElementById("calc_children").value) || 0;
      const debtorIncome = getNum("calc_debtor_income");
      const spouseIncome = getNum("calc_spouse_income");
      const otherIncome = getNum("calc_other_income");
      const medical = getNum("calc_medical");
      const travel = getNum("calc_travel");
      const kidsExp = getNum("calc_children_expenses");
      const otherExp = getNum("calc_other_expenses");
      const totalIncome = debtorIncome + spouseIncome + otherIncome;
      const baseLiving = calcBaseLiving(adults, children);
      const specialExp = medical + travel + kidsExp + otherExp;
      let disposable = totalIncome - baseLiving - specialExp;
      if (disposable < 0) disposable = 0;
      const share = totalIncome > 0 ? debtorIncome / totalIncome : 1;
      let monthly = (disposable * share) / 2;
      monthly = Math.max(0, Math.round(monthly / 10) * 10);
      document.getElementById("calc_result").innerHTML = `
        <p><strong>הכנסה כוללת:</strong> ${totalIncome.toLocaleString()} ₪</p>
        <p><strong>הוצאה בסיסית למחיה:</strong> ${baseLiving.toLocaleString()} ₪</p>
        <p><strong>הוצאות מיוחדות:</strong> ${specialExp.toLocaleString()} ₪</p>
        <p><strong>הכנסה פנויה:</strong> ${disposable.toLocaleString()} ₪</p>
        <p><strong>חלק החייב בהכנסה:</strong> ${(share * 100).toFixed(0)}%</p>
        <hr><p style="font-size:1.2rem;"><strong>תשלום חודשי משוער:</strong> ${monthly.toLocaleString()} ₪</p>`;
    }
  </script>
</body>
</html>
